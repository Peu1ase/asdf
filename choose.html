<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리 선택 - 2학기 자리배정</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: .9; font-size: .95em; }
        .content { padding: 40px; }
        .section-title { color: #333; font-size: 1.5em; margin-bottom: 30px; text-align: center; }
        .firebase-status {
            text-align: center;
            margin: 15px 0 25px;
            font-size: .9em;
            color: #666;
        }
        .firebase-status.connected { color: #2e7d32; }
        .firebase-status.error { color: #c62828; }
        .seating-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }
        .table {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e0e0e0;
        }
        .table-title {
            text-align: center;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .seat {
            background: white;
            border: 2px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: all .3s ease;
            font-weight: 600;
            color: #333;
            min-height: 58px;
        }
        .seat:hover { border-color: #667eea; background: #f0f4ff; transform: translateY(-2px); }
        .seat.selected { background: #667eea; color: white; border-color: #667eea; }
        .seat.completed { background: #4caf50; color: white; border-color: #4caf50; cursor: not-allowed; }
        .seat.completed:hover { transform: none; background: #4caf50; cursor: not-allowed; }
        .seat small { display: block; font-size: .75em; margin-top: 3px; font-weight: normal; }
        .status-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 40px 0;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .status-item { text-align: center; }
        .status-box {
            width: 60px; height: 60px; border-radius: 6px; margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .status-box.selecting { background: #667eea; color: white; }
        .status-box.completed { background: #4caf50; color: white; }
        .status-label { color: #666; font-size: .9em; font-weight: 600; }
        .action-section {
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
            margin-top: 40px; padding-top: 30px; border-top: 1px solid #eee;
        }
        .btn {
            padding: 12px 30px; font-size: 1em; border: none; border-radius: 6px;
            cursor: pointer; text-decoration: none; font-weight: 600; transition: all .3s ease;
        }
        .btn-primary { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,.4); }
        .btn-secondary { background: #4caf50; color: white; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(76,175,80,.4); }
        .btn-back { background: #f0f0f0; color: #333; border: 2px solid #ddd; }
        .btn-back:hover { background: #e8e8e8; border-color: #667eea; color: #667eea; }
        .selected-info {
            background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px;
            margin: 20px 0; border-radius: 4px; text-align: center; color: #333;
        }
        .selected-info p { margin: 5px 0; }
        @media (max-width: 768px) {
            .content { padding: 20px; }
            .seating-area { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
            .btn { padding: 10px 20px; font-size: .9em; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>자리 선택</h1>
        <p>원하는 자리를 선택한 후 '선택 완료' 버튼을 클릭하세요</p>
    </div>

    <div class="content">
        <div class="status-info">
            <div class="status-item">
                <div class="status-box selecting"></div>
                <div class="status-label">선택중</div>
            </div>
            <div class="status-item">
                <div class="status-box completed"></div>
                <div class="status-label">선택 완료</div>
            </div>
        </div>

        <div id="firebaseStatus" class="firebase-status">Firebase 연결 중...</div>

        <div id="selectedInfo" class="selected-info" style="display:none;">
            <p>선택한 자리: <strong id="selectedSeat">-</strong></p>
        </div>

        <h2 class="section-title">테이블 배치도</h2>
        <h3 style="text-align:center; margin:20px;">칠판</h3>

        <div class="seating-area">
            <div class="table">
                <div class="table-title">테이블 1</div>
                <div class="seats-grid">
                    <div class="seat" data-seat="1-1" onclick="selectSeat(this,'1-1')">1-1</div>
                    <div class="seat" data-seat="1-2" onclick="selectSeat(this,'1-2')">1-2</div>
                    <div class="seat" data-seat="1-3" onclick="selectSeat(this,'1-3')">1-3</div>
                    <div class="seat" data-seat="1-4" onclick="selectSeat(this,'1-4')">1-4</div>
                    <div class="seat" data-seat="1-5" onclick="selectSeat(this,'1-5')">1-5</div>
                    <div class="seat" data-seat="1-6" onclick="selectSeat(this,'1-6')">1-6</div>
                    <div class="seat" data-seat="1-7" onclick="selectSeat(this,'1-7')">1-7</div>
                    <div class="seat" data-seat="1-8" onclick="selectSeat(this,'1-8')">1-8</div>
                    <div class="seat" data-seat="1-9" onclick="selectSeat(this,'1-9')">1-9</div>
                    <div class="seat" data-seat="1-10" onclick="selectSeat(this,'1-10')">1-10</div>
                </div>
            </div>

            <div class="table">
                <div class="table-title">테이블 2</div>
                <div class="seats-grid">
                    <div class="seat" data-seat="2-1" onclick="selectSeat(this,'2-1')">2-1</div>
                    <div class="seat" data-seat="2-2" onclick="selectSeat(this,'2-2')">2-2</div>
                    <div class="seat" data-seat="2-3" onclick="selectSeat(this,'2-3')">2-3</div>
                    <div class="seat" data-seat="2-4" onclick="selectSeat(this,'2-4')">2-4</div>
                    <div class="seat" data-seat="2-5" onclick="selectSeat(this,'2-5')">2-5</div>
                    <div class="seat" data-seat="2-6" onclick="selectSeat(this,'2-6')">2-6</div>
                    <div class="seat" data-seat="2-7" onclick="selectSeat(this,'2-7')">2-7</div>
                    <div class="seat" data-seat="2-8" onclick="selectSeat(this,'2-8')">2-8</div>
                    <div class="seat" data-seat="2-9" onclick="selectSeat(this,'2-9')">2-9</div>
                    <div class="seat" data-seat="2-10" onclick="selectSeat(this,'2-10')">2-10</div>
                </div>
            </div>

            <div class="table">
                <div class="table-title">테이블 3</div>
                <div class="seats-grid">
                    <div class="seat" data-seat="3-1" onclick="selectSeat(this,'3-1')">3-1</div>
                    <div class="seat" data-seat="3-2" onclick="selectSeat(this,'3-2')">3-2</div>
                    <div class="seat" data-seat="3-3" onclick="selectSeat(this,'3-3')">3-3</div>
                    <div class="seat" data-seat="3-4" onclick="selectSeat(this,'3-4')">3-4</div>
                    <div class="seat" data-seat="3-5" onclick="selectSeat(this,'3-5')">3-5</div>
                    <div class="seat" data-seat="3-6" onclick="selectSeat(this,'3-6')">3-6</div>
                    <div class="seat" data-seat="3-7" onclick="selectSeat(this,'3-7')">3-7</div>
                    <div class="seat" data-seat="3-8" onclick="selectSeat(this,'3-8')">3-8</div>
                    <div class="seat" data-seat="3-9" onclick="selectSeat(this,'3-9')">3-9</div>
                    <div class="seat" data-seat="3-10" onclick="selectSeat(this,'3-10')">3-10</div>
                </div>
            </div>
        </div>

        <div class="action-section">
            <a href="index.html" class="btn btn-back">뒤로가기</a>
            <button class="btn btn-primary" onclick="clearSelection()">선택 취소</button>
            <button class="btn btn-secondary" onclick="completeSelection()">선택 완료</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        doc,
        setDoc,
        deleteDoc,
        onSnapshot,
        getDocs,
        query,
        where
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBPCU8R6A7zDR9UWOcqe-RJgzYt2_pZuA0",
        authDomain: "class-e4791.firebaseapp.com",
        projectId: "class-e4791",
        storageBucket: "class-e4791.firebasestorage.app",
        messagingSenderId: "656061113276",
        appId: "1:656061113276:web:b0673b258586dd1454c1b9",
        measurementId: "G-03H9N6RJ9R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const seatsRef = collection(db, "seats");

    let currentSelected = null;
    let userSeats = {};

    const statusElement = document.getElementById('firebaseStatus');

    function setStatus(message, type = '') {
        statusElement.textContent = message;
        statusElement.className = 'firebase-status ' + type;
    }

    function getUserName() {
        return localStorage.getItem('userName') || '사용자';
    }

    function restoreSeatsUI() {
        document.querySelectorAll('.seat').forEach(element => {
            const seatId = element.dataset.seat;
            const seatInfo = userSeats[seatId];

            element.classList.remove('completed', 'selected');
            element.innerHTML = seatId;

            if (seatInfo && seatInfo.status === 'completed') {
                element.classList.add('completed');
                element.innerHTML = `${seatId} <br><small>(${escapeHtml(seatInfo.userName)})</small>`;
            }
        });

        if (currentSelected) {
            const selectedId = currentSelected.dataset.seat;
            if (userSeats[selectedId]) {
                currentSelected = null;
                document.getElementById('selectedInfo').style.display = 'none';
            } else {
                currentSelected.classList.add('selected');
            }
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    // Firestore의 seats 컬렉션을 실시간 감시합니다.
    // 한 기기에서 자리를 선택/취소하면 다른 기기에도 즉시 반영됩니다.
    onSnapshot(seatsRef, (snapshot) => {
        userSeats = {};

        snapshot.forEach((seatDoc) => {
            userSeats[seatDoc.id] = seatDoc.data();
        });

        restoreSeatsUI();
        setStatus('Firebase 연결됨 · 자리 상태가 실시간으로 동기화됩니다.', 'connected');
    }, (error) => {
        console.error('Firestore 실시간 연결 오류:', error);
        setStatus('Firebase 연결 오류: Firestore 보안 규칙을 확인하세요.', 'error');
    });

    window.selectSeat = async function(element, seatId) {
        // 이미 선택 완료된 자리
        if (element.classList.contains('completed')) {
            const completedSeat = userSeats[seatId];
            const currentUserName = getUserName();

            if (completedSeat && completedSeat.userName === currentUserName) {
                if (confirm(`${seatId} 자리를 취소하시겠습니까?`)) {
                    await cancelSeat(seatId);
                }
                return;
            }

            if (completedSeat && completedSeat.userName) {
                alert(`${completedSeat.userName}님이 이미 선택한 자리입니다.`);
            } else {
                alert('이미 선택 완료된 자리입니다.');
            }
            return;
        }

        if (currentSelected === element) {
            window.clearSelection();
            return;
        }

        if (currentSelected && currentSelected !== element) {
            alert('이미 선택 중인 자리가 있습니다. 먼저 선택 취소를 해주세요.');
            return;
        }

        element.classList.add('selected');
        currentSelected = element;

        document.getElementById('selectedSeat').textContent = seatId;
        document.getElementById('selectedInfo').style.display = 'block';
    };

    window.clearSelection = function() {
        if (currentSelected) {
            currentSelected.classList.remove('selected');
            currentSelected = null;
        }
        document.getElementById('selectedInfo').style.display = 'none';
    };

    async function cancelSeat(seatId) {
        const seatInfo = userSeats[seatId];
        const currentUserName = getUserName();

        if (!seatInfo || seatInfo.userName !== currentUserName) {
            alert('본인이 선택한 자리만 취소할 수 있습니다.');
            return;
        }

        try {
            await deleteDoc(doc(db, 'seats', seatId));
            window.clearSelection();
            alert(`${seatId} 자리가 취소되었습니다.`);
        } catch (error) {
            console.error('자리 취소 실패:', error);
            alert('자리 취소에 실패했습니다. 인터넷 연결과 Firestore 설정을 확인해주세요.');
        }
    }

    window.completeSelection = async function() {
        if (!currentSelected) {
            alert('자리를 선택해주세요.');
            return;
        }

        const seatId = document.getElementById('selectedSeat').textContent;
        const userName = getUserName();

        // 최신 데이터에서 이미 같은 이름으로 선택한 자리가 있는지 확인
        try {
            const userQuery = query(seatsRef, where('userName', '==', userName));
            const userSnapshot = await getDocs(userQuery);

            if (!userSnapshot.empty) {
                const existingSeatId = userSnapshot.docs[0].id;
                alert(`이미 ${existingSeatId} 자리를 선택하셨습니다. 한 사람당 한 자리만 선택할 수 있습니다.\n기존 자리를 취소한 후 다시 시도해주세요.`);
                return;
            }

            // 선택 직전에 해당 자리가 다른 기기에서 선택되었는지 한 번 더 확인
            if (userSeats[seatId]) {
                alert(`${userSeats[seatId].userName || '다른 사용자'}님이 이미 선택한 자리입니다.`);
                return;
            }

            await setDoc(doc(db, 'seats', seatId), {
                status: 'completed',
                userName: userName,
                updatedAt: new Date().toISOString()
            });

            window.clearSelection();
            alert(`${userName}님이 ${seatId} 자리를 성공적으로 선택했습니다.`);
        } catch (error) {
            console.error('자리 선택 실패:', error);
            alert('자리 선택에 실패했습니다. Firestore 설정과 보안 규칙을 확인해주세요.');
        }
    };
</script>
</body>
</html>
